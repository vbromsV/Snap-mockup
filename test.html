<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test av bildväljare</title>
  <style>
    body { margin: 0; padding: 16px; background: #0d0d0f; color: #f3f3f5; font-family: system-ui, sans-serif; }
    h1 { font-size: 20px; }
    p { color: #a3a3ad; font-size: 14px; line-height: 1.4; }
    .t { background: #1b1b1f; border-radius: 14px; padding: 12px; margin: 10px 0; }
    label { display: block; background: #fffc00; color: #111; font-weight: 600; text-align: center; padding: 12px; border-radius: 12px; }
    .r { font-size: 13px; margin-top: 8px; color: #a3a3ad; min-height: 1em; }
    .r img { max-width: 80px; max-height: 80px; vertical-align: middle; margin-right: 8px; border-radius: 6px; }
    code { color: #ffd; font-size: 12px; }
    a { color: #fffc00; }
  </style>
</head>
<body>
  <h1>Test av bildväljare</h1>
  <p>Tryck på knapparna en i taget. Notera vilka nummer som visar dina bilder i den vanliga bildväljaren och skicka numren till Claude.</p>
  <div id="list"></div>
  <p><a href="./">← Tillbaka till appen</a></p>
  <script>
    const variants = [
      ['1', 'accept="image/*"', { accept: 'image/*' }],
      ['2', 'accept="image/*" multiple', { accept: 'image/*', multiple: true }],
      ['3', 'accept="image/jpeg,image/png,…"', { accept: 'image/jpeg,image/png,image/webp,image/gif,image/heic,image/heif' }],
      ['4', 'accept=".jpg,.jpeg,.png,…"', { accept: '.jpg,.jpeg,.png,.webp,.heic' }],
      ['5', 'accept="image/*,video/*"', { accept: 'image/*,video/*' }],
      ['6', 'inget accept (filväljare)', {}],
    ];
    const list = document.getElementById('list');
    for (const [n, desc, attrs] of variants) {
      const box = document.createElement('div');
      box.className = 't';
      const lab = document.createElement('label');
      lab.textContent = 'Test ' + n;
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.hidden = true;
      if (attrs.accept) inp.accept = attrs.accept;
      if (attrs.multiple) inp.multiple = true;
      lab.appendChild(inp);
      const d = document.createElement('div');
      d.className = 'r';
      d.innerHTML = '<code>' + desc.replace(/</g, '&lt;') + '</code>';
      const res = document.createElement('div');
      res.className = 'r';
      inp.addEventListener('change', () => {
        const f = inp.files && inp.files[0];
        if (!f) { res.textContent = 'Ingen bild vald.'; return; }
        const url = URL.createObjectURL(f);
        res.innerHTML = '';
        const im = document.createElement('img');
        im.src = url;
        res.append(im, document.createTextNode('✅ ' + f.name + ' (' + (f.type || 'okänd typ') + ')'));
      });
      box.append(lab, d, res);
      list.appendChild(box);
    }
  </script>
</body>
</html>
